apiVersion: v1
kind: Namespace
metadata:
  name: kaiops-azure-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaiops-azure-demo
  namespace: kaiops-azure-demo
  labels:
    app: kaiops-azure-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kaiops-azure-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: kaiops-azure-demo
    spec:
      containers:
        - name: app
          image: us-central1-docker.pkg.dev/project-3da8cb5f-328e-44d3-b7a/kaiops-azure-demo/kaiops-azure-demo:6eb5c030cc3f57d6d6a431dd2b0418cb4ceb5b9a
          ports:
            - containerPort: 8080
          env:
            - name: APP_NAME
              value: "kaiops-azure-demo"
            - name: APP_VERSION
              value: "v1.0.0"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kaiops-azure-demo
  namespace: kaiops-azure-demo
  labels:
    app: kaiops-azure-demo
spec:
  selector:
    app: kaiops-azure-demo
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
